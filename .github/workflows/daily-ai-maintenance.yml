name: Daily AI maintenance
on:
    schedule:
        - cron: '11 10 * * *'
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/maintenance/**'
            - '.github/workflows/daily-ai-maintenance.yml'
permissions:
    contents: write
    issues: read
    pull-requests: write
    actions: read
concurrency:
    group: daily-ai-maintenance-${{ github.event_name == 'pull_request' && github.ref || 'default-branch' }}
    cancel-in-progress: false
jobs:
    guard-tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: python -m pip install 'PyYAML==6.0.3'
            - run: python -m unittest discover -s .github/maintenance -p 'test_*.py'
            - run: bash -n .github/maintenance/maintenance.sh
    maintain:
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        needs: guard-tests
        runs-on: ubuntu-latest
        timeout-minutes: 55
        env:
            GH_TOKEN: ${{ github.token }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Prepare trusted maintenance helpers
              run: |
                  python -m pip install 'PyYAML==6.0.3'
                  export MAINTENANCE_HELPER="$RUNNER_TEMP/maintenance-helper"
                  echo "MAINTENANCE_HELPER=$MAINTENANCE_HELPER" >> "$GITHUB_ENV"
                  mkdir -p "$MAINTENANCE_HELPER"
                  cp .github/maintenance/* "$MAINTENANCE_HELPER/"
            - name: Merge fully green low-risk dependency PRs
              shell: bash
              run: |
                  set -euo pipefail
                  echo '## Daily AI maintenance' >> "$GITHUB_STEP_SUMMARY"
                  gh pr list --state open --limit 100 --json number,title,author,isDraft,mergeable,statusCheckRollup,labels,reviewDecision > /tmp/prs.json
                  jq -c '.[]' /tmp/prs.json | while IFS= read -r pr; do
                    n=$(jq -r '.number' <<< "$pr")
                    title=$(jq -r '.title' <<< "$pr")
                    jq -e -L "$MAINTENANCE_HELPER" 'include "dependency-bots"; .author | dependency_bot' <<< "$pr" >/dev/null || continue
                    if jq -e '.isDraft or .mergeable != "MERGEABLE" or (.reviewDecision == "CHANGES_REQUESTED") or (.reviewDecision == "REVIEW_REQUIRED") or (.statusCheckRollup | length == 0) or any(.statusCheckRollup[]; .status != "COMPLETED" or .conclusion != "SUCCESS") or any(.labels[]?; .name == "ai:review-required")' <<< "$pr" >/dev/null; then continue; fi
                    if grep -Eiq '(major|breaking|\bv[0-9]+\b)' <<< "$title"; then continue; fi
                    if gh pr merge "$n" --squash; then echo "Merged dependency PR #$n" >> "$GITHUB_STEP_SUMMARY"; fi
                  done
            - name: Repair default-branch lock and workflow formatting
              id: health
              run: bash "$MAINTENANCE_HELPER/maintenance.sh" main
            - name: Preserve deterministic repair patch on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: maintenance-health-repair
                  path: ${{ runner.temp }}/maintenance-health-repair.patch
                  if-no-files-found: ignore
            - name: Install AI coding agent
              if: steps.health.outputs.changed != 'true'
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  if [ -n "$OPENAI_API_KEY" ]; then env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY python -m pip install 'aider-chat==0.86.1'; fi
            - name: Repair up to three failing dependency PRs
              if: steps.health.outputs.changed != 'true'
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              shell: bash
              run: |
                  set -euo pipefail
                  [ -n "$OPENAI_API_KEY" ] || { echo 'AI repairs skipped: OPENAI_API_KEY is not configured' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
                  gh pr list --state open --limit 100 --json number,author,isDraft,statusCheckRollup > "$RUNNER_TEMP/repair-prs.json"
                  mapfile -t prs < <(jq -r -L "$MAINTENANCE_HELPER" 'include "dependency-bots"; [.[] | select((.author | dependency_bot) and (.isDraft == false) and any(.statusCheckRollup[]?; .conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))] | sort_by(.number) | .[:3][] | .number' "$RUNNER_TEMP/repair-prs.json")
                  failed=0
                  for n in "${prs[@]}"; do
                    if ! bash "$MAINTENANCE_HELPER/maintenance.sh" dependency "$n"; then
                      echo "::error::Repair for PR #$n failed; nothing from that attempt was published"
                      failed=1
                      [ ! -f "$RUNNER_TEMP/maintenance-provider-failed" ] || break
                    fi
                  done
                  exit "$failed"
            - name: Create improvement PR requiring review
              if: steps.health.outputs.changed != 'true'
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  [ -n "$OPENAI_API_KEY" ] || { echo 'AI improvements skipped: OPENAI_API_KEY is not configured' >> "$GITHUB_STEP_SUMMARY"; exit 0; }
                  bash "$MAINTENANCE_HELPER/maintenance.sh" improvement
