name: AI software factory
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement (optional)'
        required: false
        type: string
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: ai-factory-${{ github.event.issue.number || github.event.inputs.issue_number || 'daily' }}
  cancel-in-progress: false
jobs:
  daily-triage:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identify failing PRs
        shell: bash
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,statusCheckRollup,headRefName --limit 100 > prs.json
          jq -c '.[] | select(any(.statusCheckRollup[]?; .conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))' prs.json | while IFS= read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            title=$(jq -r '.title' <<< "$pr")
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "AI repair PR #$number in:title" --json number | jq length)
            if [ "$existing" -eq 0 ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "AI repair PR #$number" --body "PR #$number ($title) has failing checks. Investigate logs, repair on the PR branch, and rerun tests. Human review required before merging."
            fi
          done
  implement:
    if: (github.event_name == 'issues' && github.event.label.name == 'ai:implement') || (github.event_name == 'workflow_dispatch' && inputs.issue_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Require model credentials
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Configure repository or organization secret OPENAI_API_KEY.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coding agent
        run: pip install 'aider-chat==0.86.1'
      - name: Implement issue on isolated branch
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          issue=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,state)
          [ "$(jq -r '.state' <<< "$issue")" = OPEN ] || exit 1
          branch="ai/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          jq -r '"Issue: " + .title + "\n\n" + (.body // "")' <<< "$issue" > /tmp/ai-task.txt
          echo 'Implement the issue described below. Keep changes minimal, preserve existing APIs, add or update tests, and do not modify workflows, secrets, or access policies.' >> /tmp/ai-task.txt
          CI=1 aider --yes --no-check-update --no-show-release-notes --no-auto-commits --no-pretty --no-stream --chat-history-file /tmp/aider-chat-history.md --input-history-file /tmp/aider-input-history --model gpt-4.1 --message-file /tmp/ai-task.txt
          git add -A -- . ':!.aider*' ':!*.log'
          if git diff --cached --quiet; then echo 'Agent produced no substantive changes'; exit 1; fi
          if git diff --cached --name-only | grep -E '(^|/)(\.github/workflows/|\.env|AGENTS\.md|renovate\.json)' ; then
            echo 'Sensitive configuration changes require a separate manual process'; exit 1
          fi
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
            npm test --if-present || { echo 'Tests failed; no PR pushed'; exit 1; }
          fi
          git commit -m "ai: implement issue #$ISSUE_NUMBER"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)" --head "$branch" --draft --title "AI: $(jq -r '.title' <<< "$issue")" --body "Implements #$ISSUE_NUMBER. Generated by AI; requires CI and human review before merge."
